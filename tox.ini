[tox]
requires =
    tox>=4.2
    tox-uv
env_list =
    lint
    py313-django52
    py3{12, 11, 10}-django{52, 42}

[testenv]
deps =
    ; the PyPI release lags behind: user management (add_user/update_user) is only on develop
    bitcaster-sdk @ git+https://github.com/bitcaster-io/bitcaster-sdk.git@develop
    django42: django<5,>=4.2
    django50: django<5.1,>=5
    django51: django<5.2,>=5.1
    django52: django<6,>=5.2
commands =
    pytest tests
dependency_groups = dev

[testenv:lint]
deps =
    mypy
    ruff
    types-requests
commands =
    ruff check src
    mypy src
