[tox]
requires =
    tox>=4.2
    tox-uv
env_list =
    lint
    py31{4, 3}-django60
    py31{4, 3}-django52
    py31{4, 3, 2, 1, 0}-django{52, 42}

[testenv]
deps =
    bitcaster-sdk @ git+https://github.com/bitcaster-io/bitcaster-sdk.git@develop
    django42: django<5,>=4.2
    django50: django<5.1,>=5
    django51: django<5.2,>=5.1
    django52: django<6,>=5.2
    django60: django<6.1,>=6
commands =
    pytest tests
dependency_groups = dev

[testenv:lint]
deps =
    mypy
    ruff
    types-requests
commands =
    ruff check src tests
    mypy src tests
