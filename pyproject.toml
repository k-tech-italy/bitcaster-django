[project]
name = "bitcaster-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "bitcaster-sdk>=0.2",
  "django>=4.2",
  "django-environ>=0.11.2",
  "requests>=2.32.3",
]

optional-dependencies.constance = [
  "django-constance>=4",
]

[dependency-groups]
dev = [
  "django-constance>=4",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.5.36",
  "mypy>=1.11.2",
  "pdbpp>=0.10.3",
  "pre-commit",
  "pytest>=8.3.3",
  "pytest-cov>=5",
  "pytest-django>=4.9",
  "tox>=4.25",
  "types-setuptools",
]

[tool.uv]
default-groups = [ "dev" ]

[tool.uv.sources]
# the PyPI release lags behind: user management (add_user/update_user) is only on develop
bitcaster-sdk = { git = "https://github.com/bitcaster-io/bitcaster-sdk.git", branch = "develop" }
