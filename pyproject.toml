[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]

[project]
name = "bitcaster-django"
description = "A Bitcaster integration with Django"
readme = "README.md"
authors = [
  { name = "Giovanni Bronzini", email = "g.bronzini@gmail.com" },
  { name = "K-Tech", email = "info@k-tech.it" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "bitcaster-sdk>=0.2",
  "django>=4.2",
  "django-environ>=0.11.2",
  "requests>=2.32.3",
]

optional-dependencies.constance = [
  "django-constance>=4",
]

[dependency-groups]
dev = [
  "django-constance>=4",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.5.36",
  "mypy>=1.11.2",
  "pdbpp>=0.10.3",
  "pre-commit",
  "pytest>=8.3.3",
  "pytest-cov>=5",
  "pytest-django>=4.9",
  "tox>=4.25",
  "types-setuptools",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/bitcaster_django/version.py"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [ "src/bitcaster_django" ]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = [ "src/bitcaster_django" ]

[tool.uv]
default-groups = [ "dev" ]
package = true

[tool.uv.sources]
# the PyPI release lags behind: user management (add_user/update_user) is only on develop
bitcaster-sdk = { git = "https://github.com/bitcaster-io/bitcaster-sdk.git", branch = "develop" }
