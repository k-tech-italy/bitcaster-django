[project]
name = "bitcaster-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
bitcaster-sdk = { git = "https://github.com/bitcaster-io/bitcaster-sdk.git" }

dependencies = [
    "bitcaster-sdk",
    "django-environ>=0.11.2",
    "psycopg[binary]",
    "pytest-django>=4.11.1",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.36",
    "mypy>=1.11.2",
    "pdbpp>=0.10.3",
    "pytest-cov>=5.0.0",
    "pytest>=8.3.3",
    "types-setuptools",
    "tox>=4.25.0",
]
django = ["django>=4.2"]

[tool.uv]
default-groups = ["django", "dev"]
